# ─────────────────────────────────────────────────────────────────────────────
# Local development stack
#
# Usage:
#   docker compose up --build
#
# Configuration is done by editing backend/config/config.php directly
# (Nextcloud-style — no env vars for DB/JWT/mail).
#
# The only env vars used at runtime are:
#   ADMIN_EMAIL  — email for the default admin user (seeded on first boot)
#   ADMIN_PASS   — password for the default admin user (seeded on first boot)
#
# Migrations run automatically on first boot via the installed flag in
# config/config.php — no separate migrate service needed.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MySQL ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: inf1005_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: changeme_root
      MYSQL_DATABASE:      inf1005_local
      MYSQL_USER:          sitizen
      MYSQL_PASSWORD:      changeme
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "--password=changeme_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Backend (nginx + php-fpm via Dockerfile) ───────────────────────────────
  backend:
    build:
      context: ..          # repo root — Dockerfile COPYs from backend/
      dockerfile: backend/Dockerfile
    container_name: inf1005_backend
    restart: unless-stopped
    environment:
      # Only secrets that must not be stored in config/config.php
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASS:  changeme_admin
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Bind-mount config so the installed flag written by Migrator persists
      # on the host across container rebuilds.
      - ./config:/var/www/config
      # Named volume for logs and rate-limit counters
      - backend_storage:/var/www/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/status.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  db_data:
  backend_storage:
