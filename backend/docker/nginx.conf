# backend/docker/nginx.conf

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Hide nginx version
    server_tokens off;

    # Gzip
    gzip on;
    gzip_types application/json text/plain;

    server {
        listen 80;
        root /var/www/public;
        index index.php;

        # Security headers
        add_header X-Content-Type-Options "nosniff"  always;
        add_header X-Frame-Options        "DENY"     always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "no-referrer" always;

        # Block access to sensitive files
        location ~ /\.(env|git|htaccess) {
            deny all;
            return 404;
        }

        # Serve Swagger JSON via PHP (no direct .php exposure)
        location = /docs/swagger.json {
            fastcgi_pass   127.0.0.1:9000;
            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME /var/www/docs/swagger.php;
            fastcgi_param  QUERY_STRING    $query_string;
            fastcgi_param  REQUEST_METHOD  $request_method;
            fastcgi_param  CONTENT_TYPE    $content_type;
            fastcgi_param  CONTENT_LENGTH  $content_length;
        }

        # Serve /docs static assets
        location /docs/ {
            root /var/www;                  # backend root
            index index.html;

            # Serve static files directly if they exist
            try_files $uri /docs/index.html;
        }

        # Deny all other .php access in /docs
        location ~ ^/docs/.*\.php$ {
            deny all;
            return 404;
        }

        location /api/ {
            fastcgi_pass   127.0.0.1:9000;
            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param  QUERY_STRING    $query_string;
            fastcgi_param  REQUEST_METHOD  $request_method;
            fastcgi_param  CONTENT_TYPE    $content_type;
            fastcgi_param  CONTENT_LENGTH  $content_length;
        }

        # PHP-FPM
        location ~ \.php$ {
          fastcgi_pass   127.0.0.1:9000;
          include        fastcgi_params;

          fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
          fastcgi_param PATH_INFO       $fastcgi_path_info;

          fastcgi_read_timeout 60s;
          fastcgi_send_timeout 60s;
        }

        # Deny access to everything outside public/
        location ~* \.(php|phtml)$ {
            deny all;
        }
    }
}
